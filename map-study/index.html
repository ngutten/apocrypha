<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valley Map Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{ /* Same world as the game: slate and lamplight. The map is the only thing on the page that is allowed to be ornate. */
  --ink:#0f1518; --slate:#172026; --line:#2a363d; --bone:#e7e0cf; --dim:#8d9a9c; --lamp:#f0d898; --verd:#62b0a3;
  --display:"IM Fell English SC","IM Fell English",Georgia,serif; --serif:"IM Fell English",Georgia,serif; --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--bone);font:15px/1.4 var(--body)}
body{padding:14px 16px 40px;max-width:1280px;margin:0 auto}
h1{font:400 24px var(--display);letter-spacing:.04em;margin:0 0 2px}
p{margin:0 0 10px;color:var(--dim);max-width:75ch}
#bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
button{font:inherit;color:inherit;background:#1d2930;border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:5px 12px}
button:hover{border-color:var(--lamp)} button:focus-visible{outline:2px solid var(--lamp);outline-offset:1px}
button[aria-pressed=true]{border-color:var(--lamp);color:var(--lamp)}
#wrap{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--slate)}
canvas{display:block;width:100%;cursor:pointer}
#info{min-height:44px;padding:8px 2px;font:italic 17px var(--serif);color:var(--verd)}
#info b{font:400 19px var(--display);color:var(--bone);font-style:normal;margin-right:8px}
</style>
</head>
<body>
<h1>Valley Map Study</h1>
<p>One seeded valley, drawn entirely from its site graph. Nothing here is a stored image. Hover a site to read it. The controls show the things worth judging: a different valley, how unexplored ground looks, other lanes showing through, and the two papers.</p>
<div id="bar">
  <button id="bSeed">Draw another valley</button>
  <button id="bFog" aria-pressed="true">Unexplored ground hidden</button>
  <button id="bGhost" aria-pressed="true">Other lanes showing through</button>
  <button id="bPaper" aria-pressed="true">Vellum paper</button>
</div>
<div id="wrap"><canvas id="cv" aria-label="A procedurally drawn map of the valley"></canvas></div>
<div id="info" role="status"></div>
<script>
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const TER = {
  plain: { n: 'River plain', fav: ['farmer'], c: '#a9bf6a', suf: ['Ford', 'Mead', 'Reach'] },
  forest: { n: 'Forest', fav: ['woodcutter', 'armorer'], c: '#5f9a78', suf: ['Holt', 'Shade', 'Weald'] },
  hills: { n: 'Hills', fav: ['miner', 'smith'], c: '#b7a58c', suf: ['Tor', 'Scar', 'Delve'] },
  ruins: { n: 'Ruins', fav: ['scholar'], c: '#8fa3d6', suf: ['Gate', 'Hold', 'Stair'] },
  peak: { n: 'High peak', fav: ['priest'], c: '#c48bb8', suf: ['Horn', 'Crown', 'Spire'] },
  marsh: { n: 'Marsh', fav: [], c: '#7d8c7a', suf: ['Fen', 'Mire', 'Sink'] },
  shore: { n: 'Empty strand', fav: [], c: '#d0603f', suf: [] }
};
const FEAT = {
  relic_sword: 'The Unbroken Sword lies here, unfinished.', relic_bell: 'The Bell That Rings Backward lies here, uncast.', relic_lens: 'The Lens of Last Light lies here, unground.',
  deep: 'A vein far too rich for a hill this size. Something is asleep under it, and mining will wake it.',
  pit: 'A plague pit. A third of any people who settle here die of it.',
  hint_terrace: 'Terraced walls, older than the oldest song. Somebody once made this ground hold more than it should.', hint_mill: 'A millstone the size of a house, cracked, beside a dry race.', hint_lib: 'Shelves cut into the rock, floor to roof, every one of them empty.', hint_temple: 'A nave with no roof. A whisper at one end is a shout at the other.', hint_foundry: 'A casting pit, and in it the mould of something very large.',
  cache: 'A cache of seasoned timber and sealed grain.', vault: 'A vault of tablets, still legible.', stones: 'Standing stones that hum at dusk.', herd: 'A valley of half-tame cattle.'
};

  const far = by.slice(-10), rel = [far[far.length - 1]];

  const pitC = free().filter(s => by.indexOf(s) >= 3); if (pitC.length) pitC[Math.floor(R() * pitC.length)].feat = 'pit';
  shuf(free()).slice(0, 9).forEach((s, i) => { s.feat = ['hint_terrace', 'hint_mill', 'hint_lib', 'hint_temple', 'hint_foundry', 'cache', 'vault', 'stones', 'herd'][i]; });
  const pre = shuf(['Orrin', 'Kesh', 'Vale', 'Mara', 'Tolm', 'Isk', 'Brae', 'Dun', 'Ysa', 'Corr', 'Ael', 'Pell', 'Hask', 'Nim', 'Ruth', 'Ostra', 'Vesk', 'Lorn', 'Emm', 'Thar', 'Quil', 'Sav']);
  S.forEach((s, i) => { s.name = i === 0 ? 'Hearthford' : pre[i % pre.length] + ' ' + TER[s.ter].suf[Math.floor(R() * 3)]; });

/* ---------- seeded noise ---------- */

/* ---------- state ---------- */
const PAPER = {
  slate: { paper: [27, 37, 41], sea: [19, 27, 31], ink: [217, 208, 188], wash: .17, lane: '#cfa650' },
  vellum: { paper: [219, 207, 178], sea: [190, 196, 180], ink: [58, 44, 32], wash: .30, lane: '#8a4a1c' }

const GHOSTS = ['#62b0a3', '#d0603f'];
let seed = 20261111, MAP, fog = true, ghost = true, paper = 'vellum', base = null, V = null, hover = -1, K = null;
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';

/* what the demo pretends the Archive knows: the active lane's ground, and two other lanes */
function knowledge() {
  const S = MAP.sites, by = S.filter(s => !s.shore).sort((a, b) => a.dist - b.dist), own = {}, known = {}, vis = {};
  by.slice(0, 5).forEach(s => { own[s.id] = 1 + Math.floor(hash2(s.id, 3, seed) * 7); });
  const walk = (k) => { const set = { 0: 1 }; let cur = S[0]; for (let i = 0; i < 3; i++) { const nx = cur.adj.map(e => S[e.to]).filter(q => !q.shore && !set[q.id]).sort((a, b) => hash2(a.id, k, seed) - hash2(b.id, k, seed))[0]; if (!nx) break; set[nx.id] = 1; cur = nx; } return set; };

  for (const s of S) if (known[s.id] || s.adj.some(e => known[e.to])) vis[s.id] = 1;

function halo(c, P, x, y, w, h, u) { c.save(); c.shadowColor = rgba(P.paper, .95); c.shadowBlur = u * 3; c.fillStyle = rgba(P.paper, .6); const i = u * 1.2; for (let k = 0; k < 2; k++) c.fillRect(x + i, y + i, Math.max(1, w - 2 * i), Math.max(1, h - 2 * i)); c.restore(); }

let GEO = null;
function geography() {

/* ---------- the base sheet: drawn once per valley, per paper, per state of knowledge ---------- */
function drawBase() {
