<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Errata at the End of Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* One world, one theme: an archive at the end of time. Slate and lamplight.
     Layout: the river of lanes spans the top and carries all the color; three quiet columns below it. */
  --ink:#0f1518; --slate:#172026; --slate2:#1d2930; --line:#2a363d;
  --bone:#e7e0cf; --dim:#8d9a9c; --brass:#cfa650; --lamp:#f0d898; --verd:#62b0a3; --ember:#d0603f;
  --display:"IM Fell English SC","IM Fell English",Georgia,serif;
  --serif:"IM Fell English",Georgia,serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--bone);font:15px/1.35 var(--body)}
body{padding:0 16px 40px;max-width:1500px;margin:0 auto}
button{font:inherit;color:inherit;background:var(--slate2);border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:4px 10px}
button:hover:not(:disabled){border-color:var(--brass)}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--lamp);outline-offset:1px}
button:disabled{opacity:.35;cursor:default}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h3{font-size:15px;letter-spacing:.06em;color:var(--brass);margin:14px 0 6px;display:flex;gap:8px;align-items:baseline}
h3 .dim{font:13px var(--body);letter-spacing:0}
.dim{color:var(--dim)} .bad{color:var(--ember)} .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
small{color:var(--dim);font-size:13px}

#top{display:flex;align-items:center;gap:14px;padding:14px 0 10px;flex-wrap:wrap}
#glass{border:none;background:none;padding:2px;line-height:0}
#glass svg{width:26px;height:34px}
#glass.tilt svg{animation:tilt .35s ease}
@keyframes tilt{40%{transform:rotate(24deg)}100%{transform:rotate(0)}}
h1{font-size:24px;letter-spacing:.04em;margin-right:auto}
#hz{font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:baseline}
#hz b{font:400 20px var(--display);color:var(--lamp)} #hz span{color:var(--verd)}
#bArchive span{color:var(--lamp);margin-left:6px;font-variant-numeric:tabular-nums}

#river{display:grid;grid-template-columns:168px 1fr;border:1px solid var(--line);border-radius:6px;background:var(--slate);overflow:hidden}
#lanes{padding-top:0;border-right:1px solid var(--line)}
.lhead{height:40px;display:flex;align-items:flex-end;padding:0 10px 6px;color:var(--dim);font-size:13px}
.lane{height:46px;padding:5px 8px 0 12px;position:relative;cursor:pointer;border-left:3px solid transparent;overflow:hidden}
.lane.on{border-left-color:var(--h);background:var(--slate2)}
.lane b{display:block;font:400 16px/1.1 var(--serif);color:var(--h);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:44px}
.lane small{display:block;white-space:nowrap;font-size:12px}
.lane .lt{position:absolute;right:4px;top:4px;display:none;gap:2px}
.lane:hover .lt,.lane.on .lt{display:flex}
.lane .lt button{padding:0 5px;font-size:12px;background:var(--ink)} .lane .lt .ask{color:var(--ember);border-color:var(--ember)}
.lane input{width:100%;font:16px var(--serif);background:var(--ink);color:var(--bone);border:1px solid var(--brass);border-radius:3px;padding:3px 5px;margin-top:3px}
#cv{display:block;width:100%;cursor:ew-resize;touch-action:none}

#bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0 4px}
#curY{min-width:210px;display:flex;gap:10px;align-items:baseline;font-variant-numeric:tabular-nums}
#curY b{font:400 20px var(--display)} #curY span{color:var(--dim);font-size:13px}
#bar .sp{flex:1}
#bFollow.on{border-color:var(--lamp);color:var(--lamp)}
#hint{min-height:22px;color:var(--verd);font:italic 16px var(--serif);padding:2px 0 6px;max-width:95ch}

main{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1.25fr) minmax(280px,1fr);gap:16px;align-items:start}
main>section{background:var(--slate);border:1px solid var(--line);border-radius:6px;padding:12px 14px 14px;min-width:0}
.civ h2{font-size:22px} .civ p{margin:2px 0 8px;color:var(--dim)}
.people{display:flex;gap:6px;align-items:baseline;margin-bottom:6px} .people b{font:400 22px var(--display)} .people .g{margin-left:auto;color:var(--dim);font-size:13px}
.clim{color:var(--ember);font-size:14px;margin-bottom:6px}
.fallen{border-left:3px solid var(--ember);padding:6px 10px;background:var(--ink);color:var(--dim);margin-bottom:8px} .fallen b{display:block;color:var(--ember);font:400 17px var(--serif)}
table{width:100%;border-collapse:collapse} td{padding:3px 4px;border-top:1px solid var(--line);vertical-align:middle}
.res td:first-child{white-space:nowrap} .res i,.c i,.sum i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px}
.res .rate{color:var(--verd);width:64px} .res .note{color:var(--dim);font-size:13px;text-align:right}
.res tr.warn td{color:var(--ember)} .res tr.warn .note{color:var(--ember)}
.jobs small{display:block;font-size:12px;line-height:1.1} .jobs .ud{width:44px;white-space:nowrap} .jobs .ud button{padding:0 4px;font-size:10px;line-height:16px}
.jobs .lim{white-space:nowrap;text-align:right} .jobs .lim button{padding:0 7px} .jobs .lim span{display:inline-block;min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px} .grid.one{grid-template-columns:1fr}
.w{text-align:left;padding:6px 9px;display:flex;flex-direction:column;gap:2px}
.w b{font-weight:500;display:flex;justify-content:space-between;gap:8px} .w .n{color:var(--dim);font-weight:400;font-variant-numeric:tabular-nums}
.w small{font-size:12px;line-height:1.2}
.w.short{background:var(--slate);border-style:dashed} .w.short b{color:var(--dim)}
.w.creed{border-color:var(--brass)} .w.reg{border-color:var(--lamp);background:#2a2717}
.cost{display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-size:14px} .c.no{color:var(--ember)} .c i{margin-right:4px}
.proj{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:6px} .proj div{grid-column:1/3;height:4px;background:var(--ink);border-radius:2px} .proj i{display:block;height:100%;background:var(--verd);border-radius:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:0} .tags span{border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:13px;color:var(--dim)}
.orders{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
.orders li{display:grid;grid-template-columns:48px 1fr auto 22px;gap:6px;align-items:center;padding:2px 2px;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.orders li:hover{background:var(--slate2)} .orders .y,.log .y{color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
.orders .s{color:var(--verd);font-size:12px} .orders .wait .s{color:var(--brass)} .orders .void{color:var(--dim);text-decoration:line-through} .orders .void .s{color:var(--ember)}
.orders button{padding:0;border:none;background:none;color:var(--dim);font-size:12px} .orders button:hover{color:var(--ember)}
.orders .now{display:block;cursor:default;color:var(--lamp);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-top:1px solid var(--lamp);padding:1px 2px}
.log{list-style:none;margin:0;padding:0;font:15px/1.3 var(--serif)} .log li{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:3px 2px;border-top:1px solid var(--line)}
.log .y{font:13px var(--body);padding-top:2px} .log .omen{font-style:italic;color:var(--dim)} .log .bad,.log .fall{color:var(--ember)} .log .feat,.log .creed{color:var(--lamp)}

#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:30;max-width:min(340px,calc(100vw - 32px))}
.toast{background:var(--slate2);border:1px solid var(--line);border-left:3px solid var(--verd);border-radius:4px;padding:8px 12px;display:flex;flex-direction:column;animation:rise .25s ease}
.toast.echo{border-left-color:var(--lamp)} .toast b{font:400 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)} .toast span{font:18px var(--serif);color:var(--lamp)}
@keyframes rise{from{transform:translateY(8px);opacity:.3}}
#modal{position:fixed;inset:0;background:rgba(8,11,13,.8);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
#modal[hidden]{display:none}
#mBox{background:var(--slate);border:1px solid var(--line);border-radius:6px;max-width:860px;width:100%;padding:22px 26px 24px;position:relative}
#mBox h2{font-size:28px;color:var(--lamp);margin-bottom:8px} #mBox>button.x{position:absolute;right:12px;top:12px}
.lede,.story{font:17px/1.45 var(--serif);max-width:65ch} .story p{margin:0 0 12px}
.primary{border-color:var(--lamp);color:var(--lamp);padding:7px 18px;font:17px var(--serif)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.sum{list-style:none;padding:0;margin:0} .sum li{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:3px 0;font-variant-numeric:tabular-nums} .sum .sub{padding-left:14px;color:var(--dim)} .sum .tot{color:var(--lamp)}
.trial{border-top:1px solid var(--line);padding:6px 0} .trial b{color:var(--ember);font-weight:500} .trial p{margin:2px 0 0}
.echoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.echo{border:1px dashed var(--line);border-radius:4px;padding:8px 10px;color:var(--dim)} .echo b{font:400 16px var(--serif)} .echo p{margin:2px 0}
.echo.got{border:1px solid var(--brass);color:var(--bone)} .echo.got b{color:var(--lamp)}
.saverow{display:flex;gap:8px;flex-wrap:wrap} .saverow input{flex:1;min-width:160px;background:var(--ink);border:1px solid var(--line);color:var(--bone);border-radius:4px;padding:4px 8px;font:inherit} .danger{color:var(--ember)}
@media (max-width:1000px){main{grid-template-columns:1fr 1fr} main>section:last-child{grid-column:1/3}}
@media (max-width:640px){main,.cols{grid-template-columns:1fr} main>section:last-child{grid-column:auto} #river{grid-template-columns:112px 1fr} .lane small{display:none} .lane b{padding-right:0} h1{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header id="top">
  <button id="glass" data-a="glass" aria-label="Hourglass" title="The Archive's hourglass"><svg viewBox="0 0 26 34" fill="none" stroke="#cfa650" stroke-width="1.5"><path d="M4 2h18M4 32h18M6 2c0 9 7 11 7 15s-7 6-7 15M20 2c0 9-7 11-7 15s7 6 7 15"/><path d="M9 29c1-3 3-4 4-4s3 1 4 4z" fill="#f0d898" stroke="none"/><path d="M13 17v7" stroke="#f0d898" stroke-dasharray="1 2"/></svg></button>
  <h1>Errata at the End of Time</h1>
  <div id="hz"></div>
  <button id="bArchive" data-a="archive">Archive<span id="nEcho">0</span></button>
</header>
<section id="river" aria-label="The river of lanes">
  <div id="lanes"></div>
  <canvas id="cv" tabindex="0" aria-label="Timeline. Drag to move the cursor through the years, scroll to zoom."></canvas>
</section>
<nav id="bar" aria-label="Time controls">
  <div id="curY"></div>
  <button data-a="prev" title="Previous event in this lane (,)">⏮</button>
  <button data-a="back" title="One year back (←, shift for ten)">◀</button>
  <button data-a="fwd" title="One year on (→, shift for ten)">▶</button>
  <button data-a="next" title="Next event in this lane (.)">⏭</button>
  <button id="bFollow" data-a="follow" title="Keep the cursor on the horizon (End)">Ride the horizon</button>
  <button id="bFit" data-a="fit" hidden>Show all years</button>
  <span class="sp"></span>
  <button data-a="fork" title="Copy this lane, up to the cursor, into a new lane (F)">Fork here</button>
  <button data-a="unravel" title="Remove every order in this lane after the cursor">Unravel after cursor</button>
  <button data-a="undo" title="Undo the last change to a lane's orders (Ctrl+Z)">Undo</button>
</nav>
<div id="hint" role="status"></div>
<main>
  <section><div id="pState"></div><div id="pJobs"></div></section>
  <section id="pWorks"></section>
  <section><div id="pOrders"></div><div id="pLog"></div></section>
</main>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden><div id="mBox" role="dialog" aria-modal="true"><button class="x" data-a="close" aria-label="Close">✕</button><div id="mBody"></div></div></div>
<script>
/* ===== Engine: exact event-driven simulation. No timestepping. =====
   Between events every stock is a polynomial in tau = t - t0. Events are either
   scheduled (orders, timers, climate breakpoints, trials) or found as polynomial
   roots (a stock empties, fills, a cost becomes affordable, a throttle releases). */
const EPS = 1e-9;

/* --- polynomials: coefficient arrays, low order first --- */
function pev(p, x) { let s = 0; for (let i = p.length - 1; i >= 0; i--) s = s * x + p[i]; return s; }
function padd(a, b, k = 1) { const n = Math.max(a.length, b.length), o = new Array(n); for (let i = 0; i < n; i++) o[i] = (a[i] || 0) + k * (b[i] || 0); return o; }
function pscale(a, k) { return a.map(c => c * k); }
function pint(a, c0) { const o = [c0]; for (let i = 0; i < a.length; i++) o.push(a[i] / (i + 1)); return o; }
function pder(a) { if (a.length <= 1) return [0]; const o = []; for (let i = 1; i < a.length; i++) o.push(a[i] * i); return o; }
function ptrim(a) { let n = a.length; while (n > 1 && Math.abs(a[n - 1]) < 1e-14) n--; return n === a.length ? a : a.slice(0, n); }
function psign0(p) { for (const c of p) if (Math.abs(c) > 1e-11) return c > 0 ? 1 : -1; return 0; }
/* all real roots in [a,b], ascending: isolate between critical points, then bisect */
function proots(p, a, b) {
  p = ptrim(p); const n = p.length - 1;
  if (n <= 0) return [];
  if (n === 1) { const r = -p[0] / p[1]; return r >= a && r <= b ? [r] : []; }
  const pts = [a, ...proots(pder(p), a, b), b], out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    let lo = pts[i], hi = pts[i + 1]; const flo = pev(p, lo), fhi = pev(p, hi);
    if (flo === 0) { if (out[out.length - 1] !== lo) out.push(lo); continue; }
    if (flo * fhi < 0) { for (let k = 0; k < 70; k++) { const m = (lo + hi) / 2; if ((pev(p, m) < 0) === (flo < 0)) lo = m; else hi = m; } out.push(hi); }
    else if (fhi === 0 && i === pts.length - 2) out.push(hi);
  }
  return out;
}
function firstRoot(p, tmax, min = EPS) { if (!(tmax > min)) return Infinity; for (const x of proots(p, 0, tmax)) if (x > min) return x; return Infinity; }

/* --- the world --- */
const RES = ['vein', 'ore', 'metal', 'arms', 'wood', 'lore', 'awe', 'food', 'mem']; // topological: inputs before outputs
const JOBS = {
  farmer: { out: ['food', 0.6], clim: 1 }, woodcutter: { out: ['wood', 0.4] },
  miner: { inp: ['vein', 0.25], out: ['ore', 0.25] }, smith: { inp: ['ore', 0.3], out: ['metal', 0.3] },
  armorer: { inp: ['metal', 0.2], out: ['arms', 0.2] }, scholar: { out: ['lore', 0.15] },
  priest: { out: ['awe', 0.15] }, forager: { out: ['food', 0.12] }
};
const JOBLIST = ['scholar', 'priest', 'armorer', 'smith', 'miner', 'woodcutter', 'farmer'];
const UPKEEP = 0.1;
const CLIM = [[0, 1], [260, 1], [300, .15], [340, .15], [380, 1], [1300, 1], [1340, .45], [1370, .45], [1400, 1], [2600, 1], [2670, .1], [2780, .1], [2850, 1], [3300, 1], [4000, .5], [1e7, .5]];
function climAt(t) { let i = 0; while (CLIM[i + 1][0] <= t) i++; const [a, ca] = CLIM[i], [b, cb] = CLIM[i + 1], m = (cb - ca) / (b - a); return [ca + m * (t - a), m]; }

const BLD = {
  hut: { n: 'Hut', c: { wood: 8 }, g: 1.2, d: 'Housing for 2 more.' },
  farm: { n: 'Farm', c: { wood: 10 }, g: 1.25, d: '2 farmer posts. Farm yield follows the climate.' },
  lumber: { n: 'Lumber camp', c: { wood: 14 }, g: 1.3, d: '2 woodcutter posts.' },
  granary: { n: 'Granary', c: { wood: 25 }, g: 1.4, d: 'Stores 150 more food.' },
  script: { n: 'Scriptorium', c: { wood: 30 }, g: 1.4, d: '1 scholar post.', req: s => s.pop >= 8 || s.b.script > 0 },
  shrine: { n: 'Shrine', c: { wood: 30 }, g: 1.4, d: '1 priest post.', req: s => s.pop >= 8 || s.b.shrine > 0 },
  mine: { n: 'Mine', c: { wood: 30 }, g: 1.35, d: '2 miner posts. The vein is finite.', req: s => s.b.lumber > 0 },
  forge: { n: 'Forge', c: { wood: 40, ore: 10 }, g: 1.4, d: '1 smith post. Ore into bronze.', req: s => s.b.mine > 0 },
  armory: { n: 'Armory', c: { wood: 60, metal: 15 }, g: 1.4, d: '1 armorer post. Bronze into arms.', req: s => s.b.forge > 0 },
  stele: { n: 'Stele', c: { lore: 40, awe: 40 }, g: 1.5, d: 'People leave 25% more Memory.', req: s => !!s.creed }
};
const T2 = s => s.tr[1];
const UPG = {
  axes: { n: 'Flint Axes', c: { wood: 15 }, t: 8, d: 'Woodcutters ×1.5.' },
  irrigation: { n: 'Irrigation', c: { lore: 15 }, t: 20, d: 'Farmers ×1.5.' },
  pottery: { n: 'Sealed Jars', c: { lore: 25, wood: 40 }, t: 15, d: 'Food storage ×1.5.' },
  writing: { n: 'Writing', c: { lore: 40 }, t: 25, d: 'Scholars ×2.' },
  rites: { n: 'Rites', c: { awe: 40 }, t: 25, d: 'Priests ×2.' },
  masonry: { n: 'Masonry', c: { wood: 120, lore: 30 }, t: 30, d: 'Each hut houses 3.' },
  picks: { n: 'Bronze Picks', c: { metal: 15 }, t: 15, d: 'Miners ×2. The vein drains twice as fast.', req: s => s.b.forge > 0 },
  plough: { n: 'Bronze Plough', c: { metal: 25 }, t: 20, d: 'Farmers ×1.5.', req: s => s.b.forge > 0 },
  bellows: { n: 'Bellows', c: { metal: 30, lore: 30 }, t: 25, d: 'Smiths ×2.', req: s => s.b.forge > 0 },
  medicine: { n: 'Herb-lore', c: { lore: 100, awe: 40 }, t: 40, d: 'Growth ×1.5. Famine kills half as fast.' },
  shafts: { n: 'Deep Shafts', c: { metal: 60, wood: 200 }, t: 40, d: 'Opens 4,000 more ore in the vein.', req: s => s.b.mine > 0 },
  abyss: { n: 'The Under-Roads', c: { metal: 400, lore: 300 }, t: 80, d: 'Opens 25,000 more ore.', req: s => s.up.shafts },
  blade: { n: 'Way of the Blade', creed: 1, c: { arms: 25 }, t: 10, d: 'Armorers ×3. One creed per lane.' },
  bell: { n: 'Way of the Bell', creed: 1, c: { awe: 100 }, t: 10, d: 'Priests ×3, growth ×1.5. One creed per lane.' },
  lens: { n: 'Way of the Lens', creed: 1, c: { lore: 100 }, t: 10, d: 'Scholars ×3, research takes ¾ the time. One creed per lane.' },
  drill: { n: 'The Long Drill', c: { arms: 150 }, t: 40, d: 'Armorers ×2, smiths ×1.5.', req: s => s.creed === 'blade' },
  hymnal: { n: 'The Thousand-Voice Hymnal', c: { awe: 300 }, t: 40, d: 'Each priest gains 2% per citizen.', req: s => s.creed === 'bell' },
  academy: { n: 'The Academy', c: { lore: 300 }, t: 40, d: 'Scholars ×2, research takes half the time.', req: s => s.creed === 'lens' },
  reg_sword: { n: 'Forge the Unbroken Sword', reg: 'sword', c: { arms: 4000, metal: 500 }, t: 300, d: 'A regalia. It will take three centuries.', req: s => s.creed === 'blade' && T2(s) },
  reg_bell: { n: 'Cast the Bell That Rings Backward', reg: 'bell', c: { awe: 20000, metal: 300 }, t: 300, d: 'A regalia. It will take three centuries.', req: s => s.creed === 'bell' && T2(s) },
  reg_lens: { n: 'Grind the Lens of Last Light', reg: 'lens', c: { lore: 20000, metal: 300 }, t: 300, d: 'A regalia. It will take three centuries.', req: s => s.creed === 'lens' && T2(s) },
  call_sword: { n: 'Recall the Unbroken Sword', reg: 'sword', c: { arms: 300, lore: 1500 }, t: 60, d: 'Another lane forged it. The Archive remembers how.', req: (s, M) => M.E.reg_sword && s.creed !== 'blade' },
  call_bell: { n: 'Recall the Backward Bell', reg: 'bell', c: { awe: 1500, lore: 1500 }, t: 60, d: 'Another lane cast it. The Archive remembers how.', req: (s, M) => M.E.reg_bell && s.creed !== 'bell' },
  call_lens: { n: 'Recall the Lens of Last Light', reg: 'lens', c: { lore: 1500, awe: 1500 }, t: 60, d: 'Another lane ground it. The Archive remembers how.', req: (s, M) => M.E.reg_lens && s.creed !== 'lens' }
};
const TRIALS = [

    if (o.t > G.cur) mark();
    const r = done.get(o.id); let s2, cls = '';
    if (!r) { cls = 'wait'; s2 = end && end <= G.H ? 'lost with the lane' : 'waiting'; }
    else if (r.s === 'void') { cls = 'void'; s2 = 'void'; }
    else { s2 = r.t - o.t > .5 ? 'done ' + yr(r.t) : '✓'; if (r.done && r.done > G.H) s2 = 'begun'; }
    h += '<li class="' + cls + '" data-a="goto" data-t="' + o.t + '"><span class="y">' + yr(o.t) + '</span><span class="what">' + describe(o) + '</span><span class="s">' + s2 + '</span><button data-a="del" data-id="' + o.id + '" title="Remove this order" aria-label="Remove">✕</button></li>';
  }
  mark(); h += '</ol>';
  setHTML('pOrders', h);
}
function renderLog(b) {
  const s = sim(b), L = []; for (let i = s.log.length - 1; i >= 0 && L.length < 9; i--) if (s.log[i].t <= G.cur) L.push(s.log[i]);
  let h = '<h3>Chronicle</h3>'; if (!L.length) h += '<p class="dim">Year ' + yr(G.cur) + '. Nothing worth a line yet.</p>';
  h += '<ul class="log">' + L.map(e => '<li class="' + (e.c || '') + '"><span class="y">' + yr(e.t) + '</span>' + e.x + '</li>').join('') + '</ul>';
  setHTML('pLog', h);
}
function hint(b, V) {
  const s = sim(b), st = V.st, endSt = s.at(G.H).st;
  if (endSt.dead && endSt.dead <= G.H && G.cur >= endSt.dead) return 'This lane has fallen. Drag the cursor back to a year before it fell and change what led here. The past is not locked.';
  if (V.seg.starving) return 'Famine. Scrub back to before it began: more farms, a granary filled in the good years, or fewer huts.';
  if (!b.orders.length) return 'You are riding the horizon, the latest year the Archive can see. Two woodcutters are stacking timber. Order a Hut and a Farm.';
  if (st.pend.length && !G.follow) return 'An order here is waiting for resources. It will be carried out the moment this lane can pay.';
  if (!G.follow) return 'You are in this lane\'s past. Any order placed here rewrites everything after year ' + yr(G.cur) + '. Press End to ride the horizon again.';
  if (G.br.length === 1 && G.H > 150) return 'Fork here copies this lane up to the cursor into a second lane. Lanes run side by side and share every Echo.';
  if (st.b.script + st.b.shrine === 0 && st.pop >= 8) return 'A Scriptorium makes lore and a Shrine makes awe. Both lead to things the Archive would like to record.';
  return '';
}
function renderAll() {
  const b = act(), V = sim(b).at(G.cur), sp = speed();
  setHTML('hz', 'Horizon <b>year ' + yr(G.H) + '</b><span>+' + sp.toFixed(sp < 10 ? 2 : 1) + ' yr/s</span>');
  setHTML('nEcho', String(Object.keys(G.echo).length));
  setHTML('curY', 'Year <b>' + yr(G.cur) + '</b>' + (G.follow ? '<span>riding the horizon</span>' : '<span>' + yr(G.H - G.cur) + ' yr before the horizon</span>'));
  $('bFollow').classList.toggle('on', G.follow);
  $('bFit').hidden = !G.view;
  setHTML('hint', hint(b, V));
  renderLanes(); renderState(b, V); renderJobs(V); renderWorks(V); renderOrders(b); renderLog(b);
}

/* --- archive, intro, ending --- */
function openModal(h) { $('mBody').innerHTML = h; $('modal').hidden = false; }
function closeModal() { $('modal').hidden = true; if (G.intro) { G.intro = false; save(); } }
function archiveHTML() {
  const sp = echoSpeed(); let res = 0; const rows = G.br.map(b => { const r = resonance(b); res += r; return '<li class="sub"><span><i style="background:' + HUES[b.hue] + '"></i>' + esc(b.name) + '</span><span>+' + r.toFixed(2) + '</span></li>'; }).join('');
  let h = '<h2>The Archive</h2><p class="lede">It stands at the end of time, so it is finished with time. What a lane does once, in any year the horizon has passed, is recorded here for good, even if you later rewrite that lane or prune it.</p>';
  h += '<div class="cols"><div><h3>How fast the horizon recedes</h3><ul class="sum"><li>One year each second<span>1.00</span></li><li>Echoes<span>×' + (1 + sp).toFixed(2) + '</span></li><li>Resonance of living lanes<span>×' + (1 + res).toFixed(2) + '</span></li>' + rows + '<li class="tot">Now<span>' + speed().toFixed(2) + ' yr/s</span></li></ul><p class="dim">A lane resonates with the Memory it holds at the horizon. Memory comes from people living, and from lore and awe left unspent. Fallen lanes are silent.</p></div><div><h3>Trials witnessed</h3>';
  const seen = TRIALS.filter(T => G.H >= T.t - 45);
  if (!seen.length) h += '<p class="dim">None yet. The horizon has not reached one.</p>';
  for (const T of seen) h += '<div class="trial"><b>' + T.n + ' · year ' + T.t + '</b>' + (G.H < T.t ? '<p class="dim">Something is coming.</p>' : '<p>A lane must hold one of: ' + Object.keys(T.ans).map(k => fmt(T.ans[k].need) + ' ' + RN[T.ans[k].r].toLowerCase()).join(', ') + '. It pays that and lives. A sworn lane tries its own creed\'s answer first.</p>') + '</div>';
  if (G.H >= FINAL_T - 60) h += '<div class="trial"><b>The Unmaking · year ' + FINAL_T + '</b><p>' + (G.H < FINAL_T ? 'Something is coming, and it is the last thing.' : 'It asks for three regalia in one lane: the Sword, the Bell and the Lens. No single creed can make all three. One lane can make its own and Recall the others, once other lanes have made them.') + '</p></div>';
  h += '</div></div><h3>Echoes <span class="dim">' + Object.keys(G.echo).length + ' recorded</span></h3><div class="echoes">';
  const gate = e => e.after === undefined || (e.after === 'w' ? G.H > 300 : e.after === 2 ? G.H >= FINAL_T : G.H >= TRIALS[e.after].t);
  for (const k in ECHO) { const e = ECHO[k];
    if (G.echo[k]) h += '<div class="echo got"><b>' + e.n + '</b><p>' + e.fx + '</p><small>horizon year ' + yr(G.echo[k]) + '</small></div>';
    else if (!e.secret && gate(e)) h += '<div class="echo"><b>Unrecorded</b><p>' + e.how + '</p></div>'; }
  h += '</div><p class="dim">Some echoes leave no outline until they are found.</p>';
  h += '<h3>Save</h3><p class="dim">The game saves in this browser. Copy the save text to keep a backup or move it elsewhere.</p><div class="saverow"><button data-a="copy">Copy save text</button><input id="saveIn" placeholder="Paste save text here" aria-label="Save text to load"><button data-a="loadsave">Load</button><button data-a="reset" class="danger">Start over</button></div>';
  return h;
}
function introHTML() {
  return '<h2>Errata at the End of Time</h2><div class="story"><p>Everything has already happened. You keep the Archive at the far end of it, where the last light is filed.</p><p>One small people, four of them, start beside a river in year 0. Their history is short and ends badly. You are permitted to make corrections.</p><p>The <b>horizon</b> is the latest year you can see. It recedes on its own, about a year each second, whether you watch or not. Drag along the river to visit any year behind it. Whatever you order there happens in that year, and every later year is rewritten at once.</p><p>When one history is not enough, <b>fork</b> it. Lanes run side by side. What any lane achieves is recorded as an <b>Echo</b>, and Echoes change every lane.</p></div><button data-a="close" class="primary">Open the Archive</button>';
}
function endingHTML() {
  const mins = Math.round((Date.now() - G.born) / 60000), w = G.br.find(b => sim(b).at(G.H).st.tr[2]);
  return '<h2>The Morning After the End</h2><div class="story"><p>In year ' + FINAL_T + ' of the ' + esc(w ? w.name : 'last') + ' lane, the Unmaking arrived on schedule and found three things waiting that could not all have been made in one history.</p><p>It was shown its own face. It rang backward. It broke on an edge. Then it was morning, which the Archive has no shelf for.</p><p>' + (w ? civName(w) : 'They') + ' will never know there was an Archivist. They left you a line anyway, carved where the horizon would reach it: <i>to whoever kept correcting us, thank you for not stopping at the first draft.</i></p>' +
    '<p class="dim">Lanes kept: ' + G.br.map(b => esc(b.name)).join(', ') + '.' + (G.pruned.length ? ' Lanes pruned, and remembered here anyway: ' + G.pruned.map(esc).join(', ') + '.' : ' No lane was pruned.') + ' ' + Object.keys(G.echo).length + ' echoes, ' + mins + ' minutes of your own time.</p><p>The horizon keeps receding. The lanes are still yours.</p></div><button data-a="close" class="primary">Keep reading</button>';
}

/* --- input --- */
function eventTimes(b) { const s = sim(b), a = new Set([0]); for (const r of s.recs) a.add(r.t); for (const o of b.orders) a.add(o.t); for (const l of s.log) a.add(l.t); for (const f of s.feats) a.add(f.t); return [...a].filter(t => t <= G.H).sort((x, y) => x - y); }
function jump(dir) { const ts = eventTimes(act()); let t = dir > 0 ? ts.find(x => x > G.cur + 1e-6) : [...ts].reverse().find(x => x < G.cur - 1e-6); if (t === undefined) { if (dir > 0) { G.follow = true; G.cur = G.H; } } else { G.cur = t; G.follow = false; } dirty = true; }
function nudge(d) { G.cur = Math.max(0, Math.min(G.H, (d > 0 ? Math.floor(G.cur) : Math.ceil(G.cur)) + d)); G.follow = G.cur >= G.H; dirty = true; }
function shake() {
  G.shakes++; G.H += 300; latch('shaken'); checkEchoes(); dirty = true;
  const q = ['Three centuries fall through at once.', 'Again? The sand does not mind.', 'The Archive pretends not to notice.', 'You could also just wait. You know that.', 'At this point it is less an hourglass than a maraca.'];
  toast('<b>You shook the hourglass</b><small>' + q[Math.min(q.length - 1, G.shakes - 1)] + '</small>');
}
function onClick(e) {
  const el = e.target.closest('[data-a]'); if (!el) return; const a = el.dataset.a, x = el.dataset.x, b = act();
  if (a !== 'prune') pruneAsk = null;
  if (a === 'b') { const n = e.shiftKey ? 5 : 1; for (let i = 0; i < n; i++) place({ k: 'b', x }); }
  else if (a === 'u') place({ k: 'u', x });
  else if (a === 'lim') { const V = sim(b).at(G.cur), sl = V.d.slots[x], cur = V.st.lim[x] == null ? sl : Math.min(sl, V.st.lim[x]); let n = Math.max(0, cur + (+el.dataset.d)); place({ k: 'l', x, n: n >= sl ? null : n }); }
  else if (a === 'up' || a === 'dn') { const list = sim(b).at(G.cur).st.prio.slice(), i = list.indexOf(x), j = i + (a === 'up' ? -1 : 1); if (j < 0 || j >= list.length) return;[list[i], list[j]] = [list[j], list[i]]; place({ k: 'p', list }); }
  else if (a === 'del') { e.stopPropagation(); const id = +el.dataset.id, o = b.orders.find(o => o.id === id); if (o) edit(b, o.t, arr => arr.splice(arr.indexOf(o), 1)); }
  else if (a === 'goto') { G.cur = Math.min(G.H, +el.dataset.t); G.follow = false; }
  else if (a === 'sel') { G.act = +el.dataset.id; }
  else if (a === 'ren') { e.stopPropagation(); const id = +el.dataset.id, row = el.closest('.lane'), bb = lane(id); renaming = id; row.innerHTML = '<input id="renIn" maxlength="24" aria-label="Lane name" value="' + esc(bb.name) + '">'; cache.lanes = null; const inp = $('renIn'); inp.focus(); inp.select(); inp.onkeydown = ev => { ev.stopPropagation(); if (ev.key === 'Enter') rename(id, inp.value); if (ev.key === 'Escape') { renaming = null; dirty = true; } }; inp.onblur = () => { if (renaming === id) rename(id, inp.value); }; inp.onclick = ev => ev.stopPropagation(); return; }
  else if (a === 'prune') { e.stopPropagation(); const id = +el.dataset.id; if (pruneAsk === id) { pruneAsk = null; prune(id); } else pruneAsk = id; }
  else if (a === 'fork') fork();
  else if (a === 'unravel') { const t = G.cur; if (b.orders.some(o => o.t > t)) edit(b, t, arr => { for (let i = arr.length - 1; i >= 0; i--) if (arr[i].t > t) arr.splice(i, 1); }); }
  else if (a === 'undo') undo();
  else if (a === 'follow') { G.follow = !G.follow; if (G.follow) G.cur = G.H; else G.cur = Math.floor(G.cur); }
  else if (a === 'fit') G.view = null;
  else if (a === 'prev') jump(-1); else if (a === 'next') jump(1);
  else if (a === 'back') nudge(-1); else if (a === 'fwd') nudge(1);
  else if (a === 'archive') openModal(archiveHTML());
  else if (a === 'close') closeModal();
  else if (a === 'copy') { const t = JSON.stringify(G); const done = () => { el.textContent = 'Copied'; }; try { navigator.clipboard.writeText(t).then(done, () => { $('saveIn').value = t; $('saveIn').select(); }); } catch (err) { $('saveIn').value = t; $('saveIn').select(); } }
  else if (a === 'loadsave') { if (load($('saveIn').value.trim())) { G.last = Date.now(); undoStack = []; rebuild(); checkEchoes(); closeModal(); toast('<b>Save loaded</b>'); } else toast('<b>That text is not a save</b><small>Paste the whole thing, from the first brace to the last.</small>'); }
  else if (a === 'reset') { if (el.dataset.sure) { newGame(); undoStack = []; rebuild(); save(); openModal(introHTML()); } else { el.dataset.sure = 1; el.textContent = 'Erase everything?'; } }
  else if (a === 'glass') { const now = Date.now(); clicks = clicks.filter(t => now - t < 2500); clicks.push(now); el.classList.remove('tilt'); void el.offsetWidth; el.classList.add('tilt'); if (clicks.length >= 7) { clicks = []; shake(); } }
  dirty = true;
}
function onKey(e) {
  if (e.target.tagName === 'INPUT' || e.metaKey || e.altKey) return;
  if (!$('modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  const k = e.key;
  if (k === 'ArrowLeft') nudge(e.shiftKey ? -10 : -1); else if (k === 'ArrowRight') nudge(e.shiftKey ? 10 : 1);
  else if (k === 'Home') { G.cur = 0; G.follow = false; } else if (k === 'End') { G.follow = true; G.cur = G.H; }
  else if (k === ',' || k === '<') jump(-1); else if (k === '.' || k === '>') jump(1);
  else if ((k === 'z' || k === 'Z') && e.ctrlKey) undo(); else if (k === 'f' && !e.ctrlKey) fork();
  else if (k >= '1' && k <= '9' && G.br[+k - 1]) G.act = G.br[+k - 1].id;
  else return;
  e.preventDefault(); dirty = true;
}
function frame() {
  const now = Date.now(), dt = Math.max(0, (now - G.last) / 1000); G.last = now;
  advance(dt); if (G.follow) G.cur = G.H; if (G.cur > G.H) G.cur = G.H;
  if (!lane(G.act)) G.act = G.br[0].id;
  drawRiver();
  if (dirty || now - panelT > 200) { renderAll(); panelT = now; dirty = false; }
  if (now - saveT > 8000) { save(); saveT = now; }
  requestAnimationFrame(frame);
}
function start(hot) {
  let raw = null; try { raw = localStorage.getItem(KEY); } catch (e) { }
  if (!(hot && load(hot)) && !load(raw)) newGame();
  rebuild();
  const away = (Date.now() - G.last) / 1000, H0 = G.H;
  if (away > 0) { advance(away); G.last = Date.now(); if (away > 60 && !G.intro) toast('<b>While you were away</b><small>' + yr(G.H - H0) + ' years went by at the horizon.</small>'); }
  checkEchoes();
  document.addEventListener('click', onClick); document.addEventListener('keydown', onKey);
  const cv = $('cv'); let drag = false;
  cv.addEventListener('pointerdown', e => { drag = true; cv.setPointerCapture(e.pointerId); const r = cv.getBoundingClientRect(), i = Math.floor((e.clientY - r.top - TOP) / ROW); if (G.br[i]) G.act = G.br[i].id; scrubTo(e); });
  cv.addEventListener('pointermove', e => { if (drag) scrubTo(e); });
  cv.addEventListener('pointerup', () => { drag = false; }); cv.addEventListener('pointercancel', () => { drag = false; });
  cv.addEventListener('dblclick', () => { G.view = null; });
  cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(), [v0, v1] = getView(), tm = v0 + (e.clientX - r.left) / r.width * (v1 - v0), f = Math.exp(e.deltaY * 0.0015); let a = tm - (tm - v0) * f, b = tm + (v1 - tm) * f; if (b - a < 20) { const m = (a + b) / 2; a = m - 10; b = m + 10; } a = Math.max(0, a); b = Math.min(G.H, b); G.view = (a <= 0 && b >= G.H) ? null : [a, b]; }, { passive: false });
  window.addEventListener('beforeunload', save); document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => JSON.parse(JSON.stringify(G)));
  if (G.intro) openModal(introHTML());
  window.errata = { state: () => G, sims, skip: y => { G.H += y; checkEchoes(); dirty = true; } };
  requestAnimationFrame(frame);
}

window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);
</script>
